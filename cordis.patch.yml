# dsh-wsl-preset bundle patch: inserts the installer row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); activate with:
#
#   dsh plugin --profile web add github:yukitakasama/dsh-wsl-preset
#
# Or, for a specific dsh instance, point DSH_HOME at that instance first
# (do NOT use `--dir`: dsh forwards it to pnpm, where it means "working
# directory", not "dsh home"):
#
#   DSH_HOME=/path/to/instance/.dsh dsh plugin --profile web add github:yukitakasama/dsh-wsl-preset
#
# The row's node half copies the packaged `wsl` agent preset into
# the user preset root (${DSH_HOME:-~/.dsh}/.agent-presets) on boot, unless it
# is already installed. Pass `force: true` in the row config to overwrite the
# preset files.
- insert:
    - id: dsh-wsl-preset
      name: '@yukitakasama/dsh-wsl-preset'
