# dsh-wsl-preset bundle patch: inserts the installer row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); activate with:
#
#   dsh plugin --profile web add @deepseek-ai/dsh-wsl-preset
#
# The row's node half copies the packaged `wsl` agent preset into
# the user preset root (${DSH_HOME:-~/.dsh}/.agent-presets) on boot, unless it
# is already installed. Pass `force: true` in the row config to overwrite the
# preset files.
- insert:
    - id: dsh-wsl-preset
      name: '@deepseek-ai/dsh-wsl-preset'
